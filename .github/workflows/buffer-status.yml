name: Buffer · Read-only status
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/buffer-status.yml"
      - "tools/buffer-social/read_status.py"
  schedule:
    - cron: "47 */2 * * *"
permissions:
  contents: read
concurrency:
  group: buffer-read-only-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Buffer status
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python tools/buffer-social/read_status.py
      - name: Store status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffer-status
          path: buffer-status.json
          retention-days: 7
          if-no-files-found: error
