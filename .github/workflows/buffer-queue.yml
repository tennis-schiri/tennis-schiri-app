name: Buffer · Story-Warteschlangen nachfüllen

on:
  workflow_dispatch:
    inputs:
      modus:
        type: choice
        description: "preview prüft nur; live überträgt freigegebene Storys"
        default: preview
        required: true
        options:
          - preview
          - live
  push:
    paths:
      - 'tools/buffer-social/stories-2026.json'
  schedule:
    # Jeden Tag viermal; nie Cron als Garant für minutengenaue Ausführung verstehen.
    - cron: "18 1,7,13,19 * * *"
permissions:
  contents: write

concurrency:
  group: buffer-instagram-queue
  cancel-in-progress: false

jobs:
  reconcile:
    name: Buffer Queue sicher auffüllen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Migrationsdaten abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nur freigegebene und aus Metricool entfernte Stories nachfüllen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.modus != 'live' }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            export PREVIEW_ONLY=false
          fi
          set -o pipefail
          python tools/buffer-social/queue_sync.py | tee "$RUNNER_TEMP/buffer-queue-log.txt"

      - name: Aktuellen Buffer-Queue-Stand sichern
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/buffer-queue-log.txt" "$RUNNER_TEMP/buffer-queue-latest.txt"
          git fetch origin buffer-media
          git switch -C buffer-media origin/buffer-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p status
          cp "$RUNNER_TEMP/buffer-queue-latest.txt" status/last-buffer-queue.txt
          git add -- status/last-buffer-queue.txt
          if ! git diff --cached --quiet; then
            git commit -m "Aktualisiere Bericht zur Buffer-Warteschlange"
            git push origin HEAD:buffer-media
          fi
