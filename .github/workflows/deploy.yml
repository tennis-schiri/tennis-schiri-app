name: Tennis-Schiri App manuell veröffentlichen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: tennis-schiri-production-deploy
  cancel-in-progress: false

jobs:
  discover:
    name: Workflow-Erkennung (kein Upload)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Registrierung bestätigen
        run: echo 'Workflow wurde von GitHub erkannt. Kein FTP-Upload ausgeführt.'

  deploy:
    if: github.event_name == 'workflow_dispatch'
    name: App-Dateien per FTPS hochladen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Quellcode abrufen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js fuer Auslosungstests vorbereiten
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: PHP-Version und Syntax des Live-Dienstes prüfen
        run: |
          php -r 'if (PHP_VERSION_ID < 80200) { fwrite(STDERR, "PHP 8.2 oder neuer ist erforderlich.\\n"); exit(1); }'
          php -l site/live-feed.php
          php -l site/roadmap-lib.php
          php -l site/roadmap-api.php
          php tests/roadmap.php

      - name: Alle Node-Tests inklusive PHP-Live-Integration prüfen
        run: node --test tests/*.test.mjs

      - name: Startseite sicher in den App-FTP-Ordner laden
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for file in site/favicon.png site/index.html site/doppel.html site/assets/doppel.css site/assets/doppel-ui.js site/assets/doubles.js site/opc.html site/assets/one-point.css site/assets/one-point-ui.js site/assets/one-point.js site/assets/tournament-advisor.js site/roadmap.html site/roadmap-api.php site/roadmap-lib.php site/roadmap-seed.json site/assets/roadmap.css site/assets/roadmap.js site/assets/styles.css site/assets/storage.js site/assets/draw.js site/assets/results.js site/assets/special.js site/assets/finals.js site/assets/finals-ui.js site/assets/operations.js site/assets/operations-ui.js site/assets/live-model.js site/assets/live-ui.js site/assets/live.js site/assets/live.css site/assets/remote-live.js site/assets/app.js site/live.html site/live-feed.php; do
            test -f "$file"
          done
          : "${FTP_HOST:?FTP_HOST ist nicht als GitHub Secret hinterlegt}"
          : "${FTP_USER:?FTP_USER ist nicht als GitHub Secret hinterlegt}"
          : "${FTP_PASSWORD:?FTP_PASSWORD ist nicht als GitHub Secret hinterlegt}"

          # Der FTP-Nutzer ist auf das App-Verzeichnis beschränkt.
          # Nur ausdrücklich zugelassene Dateien, KEINE Server-Dateien löschen.
          # .htaccess, index.htm und WordPress bleiben unverändert.
          for file in site/assets/styles.css site/assets/storage.js site/assets/draw.js site/assets/results.js site/assets/special.js site/assets/finals.js site/assets/finals-ui.js site/assets/operations.js site/assets/operations-ui.js site/assets/live-model.js site/assets/live-ui.js site/assets/live.js site/assets/live.css site/assets/remote-live.js site/assets/app.js site/live.html site/live-feed.php site/favicon.png site/index.html site/doppel.html site/assets/doppel.css site/assets/doppel-ui.js site/assets/doubles.js site/opc.html site/assets/one-point.css site/assets/one-point-ui.js site/assets/one-point.js site/assets/tournament-advisor.js site/roadmap.html site/roadmap-api.php site/roadmap-lib.php site/roadmap-seed.json site/assets/roadmap.css site/assets/roadmap.js; do
            remote="${file#site/}"
            echo "Übertrage $remote …"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "ftp://${FTP_HOST}:21/$remote"
          done
          echo "Alle vierunddreißig App-Dateien wurden hochgeladen."
