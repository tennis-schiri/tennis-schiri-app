name: TENNILO Roadmap – manuell auf roadmap.tennilo.de

on:
  workflow_dispatch:
    inputs:
      reset_admin_login:
        description: 'Admin-Zugang mit ROADMAP_ADMIN_* neu setzen (bestehende Roadmap-Daten behalten)'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/roadmap-subdomain.yml'

permissions:
  contents: read

concurrency:
  group: tennilo-roadmap-subdomain
  cancel-in-progress: false

jobs:
  register:
    name: Workflow registrieren – kein Upload
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Workflow ist eingerichtet. Kein automatischer Live-Upload.'

  deploy:
    name: Passwortgeschützte Roadmap per FTPS veröffentlichen
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: TENNILO-Quellcode abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Originale TENNILO-Markenbilder abrufen
        uses: actions/checkout@v4
        with:
          repository: tennis-schiri/tennilo-website
          ref: main
          path: brand-source
          persist-credentials: false

      - name: Echte transparente Logos unverändert vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'Pillow>=10,<13'
          ( cd brand-source && python3 scripts/prepare_transparent_logos.py )

      - name: Separates Roadmap-Release zusammenstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p roadmap-site/dist/assets
          cp roadmap-site/index.html roadmap-site/dist/index.html
          cp roadmap-site/index.php roadmap-site/dist/index.php
          cp roadmap-site/strategie.php roadmap-site/dist/strategie.php
          cp roadmap-site/roadmap-api.php roadmap-site/dist/roadmap-api.php
          cp roadmap-site/roadmap-session-guard.php roadmap-site/dist/roadmap-session-guard.php
          cp roadmap-site/roadmap-lib.php roadmap-site/dist/roadmap-lib.php
          cp roadmap-site/roadmap.js roadmap-site/dist/assets/roadmap.js
          cp roadmap-site/extra.css roadmap-site/dist/assets/extra.css
          cp site/assets/styles.css roadmap-site/dist/assets/styles.css
          cp site/assets/roadmap.css roadmap-site/dist/assets/roadmap.css
          for logo in tennilo-logo-dark.png tennilo-tournament-cutout.png tennilo-score-cutout.png tennilo-score-cutout-dark.png tennilo-umpire-cutout.png; do
            test -s "brand-source/public/assets/$logo"
            cp "brand-source/public/assets/$logo" "roadmap-site/dist/assets/$logo"
          done
          python3 roadmap-site/make-favicon.py
          node roadmap-site/regenerate-seed.mjs

      - name: Initialen persönlichen Administrator-Zugang vorbereiten
        shell: bash
        env:
          ROADMAP_ADMIN_USERNAME: ${{ secrets.ROADMAP_ADMIN_USERNAME }}
          ROADMAP_ADMIN_PASSWORD: ${{ secrets.ROADMAP_ADMIN_PASSWORD }}
          ROADMAP_ADMIN_RESET: ${{ inputs.reset_admin_login && 'true' || 'false' }}
          ROADMAP_ADMIN_RESET_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          php roadmap-site/make-admin-config.php
      - name: JavaScript, PHP und Roadmap-Inhalte prüfen
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (PHP_VERSION_ID < 80200) { fwrite(STDERR, "PHP 8.2 oder neuer erforderlich.\n"); exit(1); }'
          php -l roadmap-site/make-admin-config.php
          php -l roadmap-site/verify-account-state.php
          for file in roadmap-site/dist/*.php; do php -l "$file"; done
          php roadmap-site/verify-account-state.php
          node --check roadmap-site/dist/assets/roadmap.js
          node --check roadmap-site/regenerate-seed.mjs
          php tests/roadmap.php
          php tests/roadmap-storage.php
          php tests/roadmap-portal-delete.php
          php -r 'define("TENNILO_ROADMAP_INTERNAL_SEED",true); $s=require "roadmap-site/dist/roadmap-seed.php"; if(count($s["items"])<50){exit(1);} echo "Board: ".count($s["items"])." Eintraege\n";'
          grep -Fq 'TENNILO Umpire' roadmap-site/dist/strategie.php
          grep -Fq 'Tischtennis' roadmap-site/dist/strategie.php
          test ! -f roadmap-site/dist/roadmap-seed.json
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("roadmap-site/dist")
          for name, expected in [
              ("favicon.ico", (256, 256)),
              ("favicon-32.png", (32, 32)),
              ("favicon-192.png", (192, 192)),
              ("apple-touch-icon.png", (180, 180)),
          ]:
              with Image.open(root / name) as icon:
                  if name == "favicon.ico":
                      assert (256, 256) in icon.info.get("sizes", set()), "Missing 256px ICO"
                  else:
                      assert icon.size == expected, (name, icon.size)
              print("Favicon OK:", name)
          PY

      - name: HTTPS der Roadmap-Subdomain prüfen
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' https://roadmap.tennilo.de/)"
          case "$status" in
            200|301|302|303|307|308|401|403|404) echo "HTTPS erreichbar: HTTP $status";;
            *) echo "::error::HTTPS der Roadmap-Subdomain nicht erreichbar (HTTP $status)."; exit 1;;
          esac

      - name: Nur Roadmap-Dateien per FTPS hochladen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.ROADMAP_FTP_HOST }}
          FTP_USER: ${{ secrets.ROADMAP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.ROADMAP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Secret ROADMAP_FTP_HOST fehlt}"
          : "${FTP_USER:?Secret ROADMAP_FTP_USER fehlt}"
          : "${FTP_PASSWORD:?Secret ROADMAP_FTP_PASSWORD fehlt}"

          # FTP-Zugang MUSS bereits im Verzeichnis der Subdomain starten.
          # Kein .htaccess-Upload, keine Löschbefehle und kein Zugang zur Turnier-App.
          files=(
            index.html index.php strategie.php
            favicon.ico favicon-32.png favicon-192.png apple-touch-icon.png
            roadmap-api.php roadmap-lib.php roadmap-session-guard.php roadmap-seed.php roadmap-initial-admin.php
            assets/styles.css assets/roadmap.css assets/roadmap.js assets/extra.css
            assets/tennilo-logo-dark.png
            assets/tennilo-tournament-cutout.png
            assets/tennilo-score-cutout.png
            assets/tennilo-score-cutout-dark.png
            assets/tennilo-umpire-cutout.png
          )
          for relative in "${files[@]}"; do
            file="roadmap-site/dist/$relative"
            test -s "$file"
            echo "Roadmap-Datei: $relative"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" "ftp://${FTP_HOST}:21/$relative"
          done
          echo 'TENNILO Roadmap hochgeladen (21 Dateien). Persönlichen Login jetzt prüfen.'

      - name: Kontrollieren, dass ohne Login keine Roadmap-Daten ausgeliefert werden
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            --header 'Accept: application/json' \
            https://roadmap.tennilo.de/roadmap-api.php > /tmp/tennilo-roadmap-guest.json
          jq -e '.ok == true and .session.role == "guest" and (.items | length) == 0 and (.members | length) == 0' \
            /tmp/tennilo-roadmap-guest.json >/dev/null ||
              { echo '::error::Roadmap-API hat den unangemeldeten Zugriff nicht korrekt gesperrt.'; exit 1; }
          strategy_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' https://roadmap.tennilo.de/strategie.php)"
          [[ "$strategy_status" == '303' ]] || { echo "::error::Vollständige Strategie ist ohne Login zugreifbar (HTTP $strategy_status)."; exit 1; }
          phpseed_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' https://roadmap.tennilo.de/roadmap-seed.php)"
          [[ "$phpseed_status" == '404' ]] || { echo "::error::Roadmap-Seed nicht geschützt (HTTP $phpseed_status)."; exit 1; }
          echo 'Gastschutz, Login-Weiterleitung und Seed-Schutz bestätigt.'
