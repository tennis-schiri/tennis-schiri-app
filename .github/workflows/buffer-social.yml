name: Buffer · Instagram prüfen und planen

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "preview prueft Bild/Kanal/Termin ohne Post; schedule plant mit JA."
        required: true
        type: choice
        default: preview
        options:
          - check
          - preview
          - schedule
      kanal:
        description: "Instagram-Konto (nur für schedule)"
        required: false
        type: choice
        default: tennis.schiri
        options:
          - tennis.schiri
          - tennilo.app
      format:
        description: "Veröffentlichungsformat (nur für schedule)"
        required: false
        type: choice
        default: story
        options:
          - story
          - post
      zeit_berlin:
        description: "Ortszeit Europe/Berlin; Test 24.11.2026 18:00"
        required: false
        type: string
        default: "2026-11-24 18:00"
      bild_direktlink:
        description: "Öffentlicher HTTPS-Direktlink zur PNG/JPEG/WebP-Datei"
        required: false
        type: string
        default: "https://raw.githubusercontent.com/tennis-schiri/tennis-schiri-app/buffer-media/2026-11-24-tennis-schiri-communityfrage.png"
      caption:
        description: "Feed-Caption (Stories haben keine automatische Caption)"
        required: false
        type: string
      bestaetigen:
        description: "NUR bei schedule: JA eintippen. Vorher Metricool-Duplikate prüfen!"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: buffer-social-manual
  cancel-in-progress: false

jobs:
  buffer:
    name: Buffer API · ${{ inputs.modus }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Repository abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: API-Verbindung prüfen bzw. Termin freigeben
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MODE: ${{ inputs.modus }}
          CHANNEL: ${{ inputs.kanal }}
          POST_TYPE: ${{ inputs.format }}
          DATE_BERLIN: ${{ inputs.zeit_berlin }}
          MEDIA_URL: ${{ inputs.bild_direktlink }}
          CAPTION: ${{ inputs.caption }}
          CONFIRM: ${{ inputs.bestaetigen }}
        run: python tools/buffer-social/buffer_social.py
